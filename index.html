<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GplateGummy Docs</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; margin: 0; }
        #sidebar { width: 250px; background: #f4f4f4; padding: 20px; height: 100vh; overflow-y: auto; }
        #content { padding: 40px; flex: 1; max-width: 800px; line-height: 1.6; }
        ul { padding-left: 20px; }
        li { cursor: pointer; color: #0366d6; margin-bottom: 8px; }
        li:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>Documentation</h3>
        <ul id="file-list">Loading files...</ul>
    </div>

    <div id="content">
        <div id="markdown-viewer">Loading document...</div>
    </div>

    <script>
        let manifestFiles = [];
async function init() {
            try {
                const cacheBuster = '?v=' + Date.now();
                const res = await fetch('docs/manifest.json' + cacheBuster);
                manifestFiles = await res.json();
                
                renderSidebar();
                handleRoute();
            } catch (err) {
                document.getElementById('file-list').innerHTML = 'Error loading manifest.';
                document.getElementById('markdown-viewer').innerHTML = 'Could not load documentation manifest.';
            }
        }



        function renderSidebar() {
            const listElement = document.getElementById('file-list');
            listElement.innerHTML = '';

            manifestFiles.forEach(file => {
                const docName = file.replace('.md', '');
                const li = document.createElement('li');
                li.textContent = docName === 'index' ? 'Home' : docName;
                
                li.onclick = () => {
                    window.location.hash = docName === 'index' ? '' : docName;
                };
                listElement.appendChild(li);
            });
        }

        async function loadMarkdown(filename) {
            try {
                const cacheBuster = '?v=' + Date.now();
                const response = await fetch('docs/' + filename + cacheBuster);
                if (!response.ok) throw new Error("File not found");
                const markdownText = await response.text();
                document.getElementById('markdown-viewer').innerHTML = marked.parse(markdownText);
            } catch (error) {
                document.getElementById('markdown-viewer').innerHTML = '<h2>404</h2><p>Document not found.</p>';
            }
        }

        function handleRoute() {
            const hash = window.location.hash.replace('#', '').trim();
            
            if (!hash || hash === 'index') {
                loadMarkdown('index.md');
                return;
            }

            const targetFile = hash + '.md';
            if (manifestFiles.includes(targetFile)) {
                loadMarkdown(targetFile);
            } else {
                document.getElementById('markdown-viewer').innerHTML = '<h2>404</h2><p>Page not found in manifest.</p>';
            }
        }

        window.onhashchange = handleRoute;

        init();
    </script>
</body>
</html>
